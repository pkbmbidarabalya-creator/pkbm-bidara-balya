<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembelajaran & Ujian PKBM Bidara Balya</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 750px; background: #fff; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .btn { width: 100%; background: #27ae60; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn:hover { background: #219150; }
        .btn-drive { background: #e67e22; color: white; text-decoration: none; display: inline-block; text-align: center; padding: 10px 15px; border-radius: 6px; font-weight: bold; margin-top: 5px; }
        .btn-drive:hover { background: #d35400; }
        .btn-submit { background: #2980b9; }
        .btn-submit:hover { background: #1f6391; }
        .card { background: #ecf0f1; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .mapel-btn { background: #8e44ad; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 5px; }
        .mapel-btn:hover { background: #732d91; }
        .hidden { display: none; }
        .soal-item { background: #f9f9f9; border-left: 4px solid #3498db; padding: 12px; margin-bottom: 15px; border-radius: 4px; }
        .soal-item p { margin: 0 0 10px 0; font-weight: 600; }
        .option-label { display: block; margin: 5px 0; cursor: pointer; font-weight: normal; }
        .box-materi { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>PKBM BIDARA BALYA</h1>
    <h2>Portal Pembelajaran & Ujian Kesetaraan</h2>

    <!-- LANGKAH 1: LOGIN SISWA & PILIH KELAS -->
    <div id="step-login">
        <div class="form-group">
            <label for="namaSiswa">Nama Lengkap Siswa:</label>
            <input type="text" id="namaSiswa" placeholder="Masukkan nama lengkap Anda..." required>
        </div>
        <div class="form-group">
            <label for="pilihSemester">Pilih Kelas & Semester:</label>
            <select id="pilihSemester" onchange="cekLinkMateri()">
                <option value="">-- Pilih Kelas & Semester --</option>
                <!-- PAKET A -->
                <option value="Kelas 4 - Semester 1">Paket A: Kelas IV - Semester 1</option>
                <option value="Kelas 4 - Semester 2">Paket A: Kelas IV - Semester 2</option>
                <option value="Kelas 5 - Semester 1">Paket A: Kelas V - Semester 1</option>
                <option value="Kelas 5 - Semester 2">Paket A: Kelas V - Semester 2</option>
                <option value="Kelas 6 - Semester 1">Paket A: Kelas VI - Semester 1</option>
                <option value="Kelas 6 - Semester 2">Paket A: Kelas VI - Semester 2</option>
                <!-- PAKET B -->
                <option value="Kelas 7 - Semester 1">Paket B: Kelas VII - Semester 1</option>
                <option value="Kelas 7 - Semester 2">Paket B: Kelas VII - Semester 2</option>
                <option value="Kelas 8 - Semester 1">Paket B: Kelas VIII - Semester 1</option>
                <option value="Kelas 8 - Semester 2">Paket B: Kelas VIII - Semester 2</option>
                <option value="Kelas 9 - Semester 1">Paket B: Kelas IX - Semester 1</option>
                <option value="Kelas 9 - Semester 2">Paket B: Kelas IX - Semester 2</option>
                <!-- PAKET C -->
                <option value="Kelas 10 - Semester 1">Paket C: Kelas X - Semester 1</option>
                <option value="Kelas 10 - Semester 2">Paket C: Kelas X - Semester 2</option>
                <option value="Kelas 11 - Semester 1">Paket C: Kelas XI - Semester 1</option>
                <option value="Kelas 11 - Semester 2">Paket C: Kelas XI - Semester 2</option>
                <option value="Kelas 12 - Semester 1">Paket C: Kelas XII - Semester 1</option>
                <option value="Kelas 12 - Semester 2">Paket C: Kelas XII - Semester 2</option>
            </select>
        </div>

        <!-- AKSES MATERI PEMBELAJARAN (DRIVE) -->
        <div id="boxMateri" class="box-materi hidden">
            <p style="margin:0 0 8px 0; font-weight:bold;">📚 Materi & Modul Pembelajaran:</p>
            <a id="btnDriveMateri" href="#" target="_blank" class="btn-drive">Buka Folder Materi Pembelajaran (Google Drive) 📂</a>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <h3>Masuk ke Ujian Online:</h3>
        <div class="form-group">
            <label for="pilihHari">Pilih Hari Ujian:</label>
            <select id="pilihHari">
                <option value="">-- Pilih Hari --</option>
                <option value="Hari 1">Hari 1</option>
                <option value="Hari 2">Hari 2</option>
                <option value="Hari 3">Hari 3</option>
            </select>
        </div>
        <div class="form-group">
            <label for="tokenUjian">Token Ujian Harian:</label>
            <input type="text" id="tokenUjian" placeholder="Masukkan token dari pengawas..." required>
        </div>
        <button class="btn" onclick="verifikasiToken()">Masuk & Tampilkan Ujian 🚀</button>
    </div>

    <!-- LANGKAH 2: DAFTAR MATA PELAJARAN -->
    <div id="step-mapel" class="hidden">
        <div class="card">
            <p><strong>Nama Siswa:</strong> <span id="dispNama"></span></p>
            <p><strong>Ujian:</strong> <span id="dispSem"></span> (<span id="dispHari"></span>)</p>
        </div>
        <h3>Mata Pelajaran Hari Ini:</h3>
        <div id="daftarMapelContainer"></div>
    </div>

    <!-- LANGKAH 3: LEMBAR SOAL UJIAN -->
    <div id="step-soal" class="hidden">
        <div class="card">
            <h3 id="judulMapel"></h3>
        </div>
        <form id="formSoal">
            <div id="soalContainer"></div>
            <button type="button" class="btn btn-submit" onclick="hitungDanKirimNilai()">Selesai & Kirim Jawaban 📤</button>
        </form>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxl-kk96fJ4mPazFjr4eVMUSs73Zcrr-LNuvnvd6ILGApqtQ8f66zZLk7vaiv7KtFvFcA/exec";

    const databaseLink = {
        // PAKET A
        "Kelas 4 - Semester 1": { drive: "https://drive.google.com/drive/folders/1gi2b0OpL-x43l_QSinKZHpGJCkBuOkDu", ujian: [] },
        "Kelas 4 - Semester 2": { drive: "https://drive.google.com/drive/folders/1MdJnOiF4ZsrodoySo0G7T2oi3TFJin5K", ujian: [] },
        "Kelas 5 - Semester 1": { 
            drive: "https://drive.google.com/drive/folders/1nOip4hKrldfGhZKzy6eiszg7KpWqi_oN", 
            ujian: [
                // HARI 1
                { mapel: "Pendidikan Agama", hari: "Hari 1", token: "HARI1KELAS5", link: "Paket A/Kelas V/Semester 1/Hari 1/soal_agama_kelas_v_semester1.json" },
                { mapel: "Bahasa Indonesia", hari: "Hari 1", token: "HARI1KELAS5", link: "Paket A/Kelas V/Semester 1/Hari 1/soal_bahasa_indonesia_kelas_v_semester1.json" },
                { mapel: "Bahasa Inggris", hari: "Hari 1", token: "HARI1KELAS5", link: "Paket A/Kelas V/Semester 1/Hari 1/soal_bahasa_inggris_kelas_v_semester1.json" },
                // HARI 2
                { mapel: "IPA", hari: "Hari 2", token: "HARI2KELAS5", link: "Paket A/Kelas V/Semester 1/Hari 2/soal_ipa_kelas_v_semester1.json" },
                { mapel: "IPS", hari: "Hari 2", token: "HARI2KELAS5", link: "Paket A/Kelas V/Semester 1/Hari 2/soal_ips_kelas_v_semester1.json" },
                { mapel: "Matematika", hari: "Hari 2", token: "HARI2KELAS5", link: "Paket A/Kelas V/Semester 1/Hari 2/soal_matematika_kelas_v_semester1.json" },
                // HARI 3
                { mapel: "PJOK", hari: "Hari 3", token: "HARI3KELAS5", link: "Paket A/Kelas V/Semester 1/Hari 3/soal_pjok_kelas_v_semester1.json" },
                { mapel: "PPKn", hari: "Hari 3", token: "HARI3KELAS5", link: "Paket A/Kelas V/Semester 1/Hari 3/soal_ppkn_kelas_v_semester1.json" },
                { mapel: "Seni Budaya", hari: "Hari 3", token: "HARI3KELAS5", link: "Paket A/Kelas V/Semester 1/Hari 3/soal_senibudaya_v_semester1.json" }
            ]
        },
        "Kelas 5 - Semester 2": { drive: "https://drive.google.com/drive/folders/1s6hAeHiF92dwnfip1hKOSAS-kBNnMJed", ujian: [] },
        "Kelas 6 - Semester 1": { drive: "https://drive.google.com/drive/folders/1gHvv32-BptZqmxmJ641rR8PKoZEymF5", ujian: [] },
        "Kelas 6 - Semester 2": { drive: "https://drive.google.com/drive/folders/1glq-8mNk4mpwGn0-eRlw0xARm2-0kujt", ujian: [] },

        // PAKET B
        "Kelas 7 - Semester 1": { drive: "https://drive.google.com/drive/folders/12CIwFtxLQ4tkRtVE7BcpqESgQgFWf0k5", ujian: [] },
        "Kelas 7 - Semester 2": { drive: "https://drive.google.com/drive/folders/1_Fs4RE_8JtTxagQNL0SpwH0ull40kAJG", ujian: [] },
        "Kelas 8 - Semester 1": { drive: "https://drive.google.com/drive/folders/1791FarQ19k5ZJUmoUAN-erLLt6PpJQZ", ujian: [] },
        "Kelas 8 - Semester 2": { drive: "https://drive.google.com/drive/folders/1D0SU12vsWIDR6jnJPHVEGHQzKFeWJP8V", ujian: [] },
        "Kelas 9 - Semester 1": { drive: "https://drive.google.com/drive/folders/1gvQOnP8UbAz10YJCwiAO53QBDOAUbPmu", ujian: [] },
        "Kelas 9 - Semester 2": { drive: "https://drive.google.com/drive/folders/1VTkkaiTfg2ITSVh6KJIKfMwa6Xb73E7A", ujian: [] },

        // PAKET C
        "Kelas 10 - Semester 1": { drive: "https://drive.google.com/drive/folders/1LFG3bduMUqFzzifBojlFrSoZNjTAFHS0", ujian: [] },
        "Kelas 10 - Semester 2": { drive: "https://drive.google.com/drive/folders/18pRK14JT6zlgFC73mi4Z-Nyej67DXpiF", ujian: [] },
        "Kelas 11 - Semester 1": { drive: "https://drive.google.com/drive/folders/11BpzFSrqw8pIT5Fh5Jx6hma6rsVCGysw", ujian: [] },
        "Kelas 11 - Semester 2": { drive: "https://drive.google.com/drive/folders/1E7bICVfnFRbTT3SsA2H9B1HCsyVqu_72", ujian: [] },
        "Kelas 12 - Semester 1": { drive: "https://drive.google.com/drive/folders/1M9F66dNuo2tbAzLYUHU813Q0aQ064Unn", ujian: [] },
        "Kelas 12 - Semester 2": { drive: "https://drive.google.com/drive/folders/1ee9wL1tzMhkwkTKylXuls52rq2f1_fj", ujian: [] }
    };

    let currentSiswa = "";
    let currentSemester = "";
    let currentHari = "";
    let currentMapel = "";
    let currentDataSoal = [];

    function cekLinkMateri() {
        const sem = document.getElementById("pilihSemester").value;
        const boxMateri = document.getElementById("boxMateri");
        const btnDrive = document.getElementById("btnDriveMateri");

        if (sem && databaseLink[sem] && databaseLink[sem].drive) {
            btnDrive.href = databaseLink[sem].drive;
            boxMateri.classList.remove("hidden");
        } else {
            boxMateri.classList.add("hidden");
        }
    }

    function verifikasiToken() {
        const nama = document.getElementById("namaSiswa").value.trim();
        const sem = document.getElementById("pilihSemester").value;
        const hari = document.getElementById("pilihHari").value;
        const token = document.getElementById("tokenUjian").value.trim();

        if (!nama || !sem || !hari || !token) {
            alert("Harap isi Nama, Kelas/Semester, Hari Ujian, dan Token!");
            return;
        }

        const dataSem = databaseLink[sem];
        if (!dataSem || !dataSem.ujian) {
            alert("Data ujian untuk kelas/semester ini belum diatur.");
            return;
        }

        const mapelHariIni = dataSem.ujian.filter(item => item.hari === hari);

        if (mapelHariIni.length === 0) {
            alert("Belum ada daftar soal untuk kelas/hari ini.");
            return;
        }

        if (mapelHariIni[0].token !== token) {
            alert("Token Ujian Salah!");
            return;
        }

        currentSiswa = nama;
        currentSemester = sem;
        currentHari = hari;

        document.getElementById("dispNama").innerText = nama;
        document.getElementById("dispSem").innerText = sem;
        document.getElementById("dispHari").innerText = hari;

        const container = document.getElementById("daftarMapelContainer");
        container.innerHTML = "";

        mapelHariIni.forEach(item => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h4>${item.mapel}</h4>
                <button class="mapel-btn" onclick="muatSoal('${item.mapel}', '${item.link}')">Mulai Kerjakan Soal 📝</button>
            `;
            container.appendChild(card);
        });

        document.getElementById("step-login").classList.add("hidden");
        document.getElementById("step-mapel").classList.remove("hidden");
    }

    function muatSoal(mapel, jsonLink) {
        currentMapel = mapel;
        document.getElementById("judulMapel").innerText = "Mata Pelajaran: " + mapel;
        
        fetch(jsonLink)
            .then(res => {
                if(!res.ok) throw new Error("Gagal mengambil data soal.");
                return res.json();
            })
            .then(data => {
                currentDataSoal = data;
                tampilkanLembarSoal(data);
                document.getElementById("step-mapel").classList.add("hidden");
                document.getElementById("step-soal").classList.remove("hidden");
            })
            .catch(err => {
                alert("Gagal memuat soal. Pastikan jalur file JSON sudah benar!");
                console.error(err);
            });
    }

    function tampilkanLembarSoal(soalArray) {
        const container = document.getElementById("soalContainer");
        container.innerHTML = "";

        soalArray.forEach((q, idx) => {
            const div = document.createElement("div");
            div.className = "soal-item";

            let pilihanHTML = "";
            q.pilihan.forEach((pil, pIdx) => {
                pilihanHTML += `
                    <label class="option-label">
                        <input type="radio" name="soal_${idx}" value="${pIdx}"> ${pil}
                    </label>
                `;
            });

            div.innerHTML = `<p>${idx + 1}. ${q.pertanyaan}</p>${pilihanHTML}`;
            container.appendChild(div);
        });
    }

    function hitungDanKirimNilai() {
        let skor = 0;
        const totalSoal = currentDataSoal.length;

        currentDataSoal.forEach((q, idx) => {
            const selected = document.querySelector(`input[name="soal_${idx}"]:checked`);
            if (selected && parseInt(selected.value) === q.jawaban) {
                skor++;
            }
        });

        const nilaiFinal = Math.round((skor / totalSoal) * 100);

        if (!confirm(`Yakin ingin mengirim jawaban ${currentMapel}?\n\nNilai Anda: ${nilaiFinal}`)) {
            return;
        }

        const payload = {
            nama: currentSiswa,
            semester: currentSemester,
            hari: currentHari,
            mapel: currentMapel,
            nilai: nilaiFinal
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert("Nilai Anda berhasil dikirim!");
            document.getElementById("step-soal").classList.add("hidden");
            document.getElementById("step-mapel").classList.remove("hidden");
        })
        .catch(err => {
            alert("Gagal mengirim nilai.");
            console.error(err);
        });
    }
</script>

</body>
</html>
